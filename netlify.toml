# Netlify Configuration for GhostFeed
# Deploy Next.js app to Netlify (alternative to Vercel)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

# Next.js runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set these in Netlify dashboard)
# LLM_BASE_URL = "https://your-llm-endpoint.com/v1"
# LLM_API_KEY = "sk-your-api-key"
# LLM_MODEL = "gpt-4o-mini"

# Redirects and headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Deployment instructions:
# 1. Push your code to GitHub/GitLab/Bitbucket
# 2. Go to netlify.com and click "Add new site"
# 3. Connect your repository
# 4. Netlify will auto-detect Next.js settings from this file
# 5. Add environment variables in Site settings → Environment variables
# 6. Deploy!
# 
# Your site will be available at: https://your-site-name.netlify.app
