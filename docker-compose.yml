# GhostFeed Docker Compose Configuration
# For easy VPS deployment with Docker

version: '3.8'

services:
  ghostfeed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostfeed
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional: Set these for AI-powered digest
      # Remove or comment out if you only want rule-based digest
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/feeds?url=https://blog.rust-lang.org/feed.xml', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ghostfeed-network

networks:
  ghostfeed-network:
    driver: bridge

# Usage:
# 1. Create .env file with your LLM credentials (optional)
# 2. Run: docker-compose up -d
# 3. Access at http://localhost:3000
# 4. View logs: docker-compose logs -f
# 5. Stop: docker-compose down
